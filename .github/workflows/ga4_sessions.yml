name: GA4 sessions -> BigQuery

# Manual runs only. Add a `schedule:` trigger to run nightly.
on:
  workflow_dispatch:

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load GA4 sessions
        env:
          # Non-secret identifiers: repository variables override config.yaml.
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          BQ_DATASET: ${{ vars.BQ_DATASET }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: python -m pipelines.ga4_to_bigquery sessions
